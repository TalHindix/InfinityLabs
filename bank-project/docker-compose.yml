# Docker Compose configuration for LOCAL TESTING only
# 
# Production deployment:
#   - Server: Render Docker Service (uses server/Dockerfile)
#   - Client: Vercel (no Docker)
#   - Database: MongoDB Atlas (no Docker)
#
# Usage: docker compose up -d

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status() } catch(e) { rs.initiate() } db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/Dubai-Bank
      CLIENT_URL: http://localhost
      SERVER_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
        VITE_SOCKET_URL: http://localhost:3000
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
