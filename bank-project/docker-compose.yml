# Docker Compose configuration for LOCAL TESTING only
# 
# Production deployment:
#   - Server: Render Docker Service (uses server/Dockerfile)
#   - Client: Vercel (no Docker)
#   - Database: MongoDB Atlas (no Docker)
#
# Usage: docker compose up -d

services:
  mongo:
    image: mongo:7
    hostname: mongo
    command: ["mongod", "--replSet", "rs0"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok && db.adminCommand('ping') } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/Dubai-Bank
      CLIENT_URL: http://localhost
      SERVER_URL: http://localhost:3000
      COOKIE_SAME_SITE: lax
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: ""
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
